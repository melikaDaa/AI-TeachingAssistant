<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <title>دستیار مدرس‌یار در حال فکر کردن</title>
  <defs>
    <linearGradient id="bodyGradT" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#5F3DC4"/>
    </linearGradient>
    <linearGradient id="visorGradT" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#1E2A5E"/>
      <stop offset="1" stop-color="#0F1638"/>
    </linearGradient>
    <linearGradient id="capGradT" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2B4BD8"/>
      <stop offset="1" stop-color="#1E3A9E"/>
    </linearGradient>
    <linearGradient id="tasselGradT" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F59F00"/>
      <stop offset="1" stop-color="#E8890C"/>
    </linearGradient>
    <linearGradient id="ringGradT" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#74C0FC"/>
      <stop offset="1" stop-color="#4DABF7"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="56" fill="#F0F4FF"/>

  <ellipse cx="60" cy="108" rx="32" ry="6" fill="#E0E7FF" opacity=".6"/>

  <path d="M28 78C20 60 22 40 34 30c14-12 38-12 52 0 12 10 14 30 6 48l-8 10H36l-8-10z" fill="url(#bodyGradT)"/>

  <rect x="30" y="72" width="60" height="14" rx="7" fill="#fff" opacity=".15"/>

  <circle cx="60" cy="52" r="26" fill="url(#visorGradT)"/>

  <ellipse cx="52" cy="48" rx="5" ry="3" fill="#74C0FC" opacity=".8"/>
  <ellipse cx="68" cy="48" rx="5" ry="3" fill="#74C0FC" opacity=".8"/>

  <path d="M52 60c2 3 5 4 8 4s6-1 8-4" stroke="#74C0FC" stroke-width="2" stroke-linecap="round" fill="none"/>

  <circle cx="60" cy="26" r="18" fill="url(#capGradT)"/>
  <rect x="42" y="22" width="36" height="8" rx="4" fill="#1E3A9E"/>

  <line x1="60" y1="14" x2="60" y2="6" stroke="url(#tasselGradT)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="5" r="3.5" fill="url(#tasselGradT)"/>

  <circle cx="28" cy="52" r="8" fill="url(#ringGradT)"/>
  <circle cx="28" cy="52" r="4" fill="#fff" opacity=".3"/>

  <circle cx="92" cy="52" r="8" fill="url(#ringGradT)"/>
  <circle cx="92" cy="52" r="4" fill="#fff" opacity=".3"/>

  <circle cx="104" cy="24" r="3" fill="#A78BFA" opacity=".6">
    <animate attributeName="cy" values="24;18;24" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;1;.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="16" r="2" fill="#74C0FC" opacity=".5">
    <animate attributeName="cy" values="16;10;16" dur="1.5s" begin=".3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".5;1;.5" dur="1.5s" begin=".3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="98" cy="12" r="1.5" fill="#A78BFA" opacity=".4">
    <animate attributeName="cy" values="12;6;12" dur="1.5s" begin=".6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".4;1;.4" dur="1.5s" begin=".6s" repeatCount="indefinite"/>
  </circle>
</svg>
